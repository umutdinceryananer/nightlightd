name: Release

# Every v* tag becomes a GitHub release with the .deb attached. The release
# body is the annotated tag's message, so the notes are written where the
# version is minted — `git tag -a` — and nowhere else.
on:
  push:
    tags:
      - "v*"

# The one permission release creation needs.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same cache as CI, so the release build reuses compiled dependencies.
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace

      # Compiled fresh on each tag; tags are rare enough that the few minutes
      # beat carrying a third-party installer action.
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # Two packages since #50: the daemon, tray and dashboard need libc and
      # nothing else, while the panel alone needs eight X11/GL libraries.
      # The upload glob below takes both.
      - name: Package the .debs
        run: |
          cargo deb -p nightlightd --no-build
          cargo deb -p nightlightd --no-build --variant panel

      # The point of the split, asserted rather than trusted. A stray
      # dependency added to the wrong table would put the whole mesa stack
      # back on every headless install, and nothing else here would notice.
      - name: The daemon package must pull in no graphics stack
        run: |
          depends=$(dpkg-deb -f target/debian/nightlightd_*_amd64.deb Depends)
          echo "nightlightd Depends: $depends"
          if echo "$depends" | grep -Eq 'libgl|libegl|libxkbcommon|libx11|libxcursor|libxrandr|libxi'; then
            echo "::error::the daemon package declares a graphics library (#50)"
            exit 1
          fi
          panel=$(dpkg-deb -f target/debian/nightlightd-panel_*_amd64.deb Depends)
          echo "nightlightd-panel Depends: $panel"
          echo "$panel" | grep -q 'libgl1' || {
            echo "::error::the panel package lost its graphics libraries"
            exit 1
          }

      # checkout fetches the tag lightweight; force-fetch the real annotated
      # object so its message — the release notes — is readable.
      - name: Extract the tag message as release notes
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            target/debian/*.deb
